# ============================================================================
#  SHTweaks : messages du chat
# ============================================================================
#  Une section par module, plus « command » pour /shtweaks.
#  Codes couleur & et &#RRGGBB acceptés. Format SkyHand : préfixe de la
#  couleur du type, texte en &7, mots importants dans la couleur du type.
#    &a succès · &e information · &6 avertissement · &c erreur
#  Un message vide n'est pas envoyé.
# ============================================================================

sculk:
  # Premier coup sur un catalyseur sans Toucher de soie. {seconds} = délai pour confirmer.
  confirm: '&7&l« &6&lSH &8&l» &7Vous allez casser un &6catalyseur de sculk &7sans Toucher de soie : &6recassez-le &7dans les {seconds} secondes pour confirmer.'

amethyst:
  # Seulement si send-message est activé. {amount} = éclats lâchés.
  break: '&7&l« &e&lSH &8&l» &7Vous avez obtenu &e{amount} éclat(s) d''améthyste&7.'

signedit:
  vip-required: '&7&l« &c&lSH &8&l» &7Grade &cVIP &7requis pour modifier les pancartes.'
  not-your-island: '&7&l« &c&lSH &8&l» &7Vous devez être sur &cvotre île &7pour modifier les pancartes.'

islandbypass:
  # Mode bypass activé à la connexion.
  enabled: '&7&l« &e&lSH &8&l» &7Mode bypass &aACTIVÉ &7automatiquement. &e/is admin bypass &7pour le couper.'

chestshop:
  # Shop sur un coffre AdvancedChests pas encore chargé : son chargement vient d'être demandé.
  loading: '&7&l« &e&lSH &8&l» &7Le coffre de ce shop &echarge&7, réessayez dans un instant.'
  # Shop dont le coffre AdvancedChests est en train d'être vendu ou compressé.
  busy: '&7&l« &6&lSH &8&l» &7Le coffre de ce shop est en cours de &6vente &7ou de &6compression&7, réessayez dans un instant.'
  # Shop dont le coffre AdvancedChests ne peut pas être lu (type de coffre supprimé, erreur dans la console).
  unavailable: '&7&l« &c&lSH &8&l» &7Le coffre de ce shop est &cindisponible&7.'

sellwandconfirm:
  # Envoyé au joueur qui clique avec la sell wand : il doit cliquer à nouveau sur le même coffre pour vendre.
  # {price} : prix total de la vente, multiplicateur compris.
  confirmation: '&7&l« &e&lSH &8&l» &7Cliquez à nouveau sur le même coffre pour confirmer la vente de son contenu pour &e{price} SHCoins'

lavawarn:
  # Envoyé aux joueurs proches quand de la lave se transforme en obsidienne ; \n : retour à la ligne.
  # {x} {y} {z} : coordonnées du bloc d'obsidienne.
  warning: "&7&l« &6&lSH &8&l» &fDe la lave a été transformé en obsidienne\n&7Rappel: Faire un clic droit sur l'obsidienne avec un seau vide permet de la retransformer en lave ! (enlevez l'eau avant)"

kittycannon:
  no-permission: 'Vous n''avez pas la permission d''utiliser cette commande.'
  player-only: 'Seul un joueur peut exécuter cette commande.'

command:
  no-permission: '&7&l« &c&lSH &8&l» &7Vous n''avez pas la &cpermission &7d''utiliser cette commande.'
  # /shtweaks sans argument ou avec une sous-commande inconnue. {subcommands} : celles que l'expéditeur peut utiliser
  usage-line: '&7&l« &e&lSH &8&l» &7Utilisation : &e/shtweaks &7<&e{subcommands}&7>'
  # /shtweaks reload : un fichier est illisible, rien n'a changé. {file} : fichier, {error} : première ligne de l'erreur
  reload-error: '&7&l« &c&lSH &8&l» &7Rechargement annulé, &c{file} &7est illisible : &c{error}'
  reloaded: '&7&l« &a&lSH &8&l» &7Configuration rechargée : &a{active}/{total} modules &7actifs.'
  modules-header: '&7&l« &e&lSH &8&l» &7Modules de SHTweaks :'
  module-on: '&8 • &a{module} &7actif'
  module-off: '&8 • &7{module} &8coupé'
  module-missing: '&8 • &c{module} &7coupé : &c{plugin} &7absent'
