name: SHTweaks
version: '${project.version}'
main: org.Cry_Legende.sHTweaks.SHTweaks
api-version: '1.20'
author: Cry_Legende
description: Petits réglages de gameplay d'Opale, un module par réglage.
softdepend: [SuperiorSkyblock2, WildStacker]

commands:
  shtweaks:
    description: Administration de SHTweaks.
    usage: /<command> <reload|modules>

permissions:
  shtweaks.admin:
    description: Recharger la configuration et lister les modules.
    default: op
  shsignedit.use:
    description: Modifier une pancarte déjà écrite sur son île (module sign-edit).
    default: op
  shsignedit.bypass:
    description: Modifier toutes les pancartes, partout (module sign-edit).
    default: op
  shinteractreset.bypass:
    description: Les portes et trappes ouvertes ne se referment pas (module door-reset).
    default: op
