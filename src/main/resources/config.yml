# ============================================================================
#  SHTweaks : petits réglages de gameplay d'Opale
# ============================================================================
#
#  Chaque réglage est un module qui s'active ou se coupe avec « enabled ».
#  Le nom du module sert aussi dans messages.yml et dans ses permissions
#  (shtweaks.<module>.<permission>).
#
#  Modules :
#    items     Items au sol insensibles à la lave, au feu et aux explosions
#    anvils    Enclumes qui ne s'usent pas dans certains mondes
#    crops     S'accroupir fait pousser les cultures proches
#    sculk     Confirmation avant de casser un catalyseur de sculk
#    amethyst  Nombre d'éclats lâchés par une grappe d'améthyste
#    signedit  Modifier une pancarte déjà écrite : VIP, sur son île
#    doors     Portes, trappes et portillons qui reprennent leur état ; doubles portes
#    islandbypass  Mode bypass des îles (/is admin bypass) activé à la connexion
#                  pour ceux qui ont superior.admin.bypass ; le couper tient
#                  jusqu'au prochain redémarrage
#
#  Commandes :
#    /shtweaks reload   Recharge config.yml et messages.yml, relance les modules.
#    /shtweaks modules  Liste les modules et leur état.
#
#  Permissions :
#    shtweaks.admin            /shtweaks (op par défaut)
#    shtweaks.signedit.use     Modifier une pancarte déjà écrite sur son île
#    shtweaks.signedit.bypass  Modifier toutes les pancartes, partout
#    shtweaks.doors.bypass     Ce que le joueur ouvre ne reprend pas son état
# ============================================================================

modules:

  items:
    enabled: true
    # Items qui restent destructibles (un cactus récolté sur un cactus disparaît, comme en vanilla).
    excluded:
      - CACTUS

  anvils:
    enabled: true
    # Mondes où les enclumes ne s'usent jamais.
    worlds:
      - spawn

  crops:
    enabled: true
    # Rayon horizontal, en blocs, autour du joueur (une couche au-dessus et en dessous).
    radius: 2
    # Chance, sur 100, qu'une culture prenne un stade à chaque accroupissement.
    chance: 35
    # Délai minimal, en millisecondes, après un accroupissement qui a fait pousser quelque chose.
    cooldown-ms: 500
    # Blocs accélérés. Canne à sucre et cactus : l'âge monte, le bloc suivant pousse ensuite.
    crops:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
      - NETHER_WART
      - COCOA
      - MELON_STEM
      - PUMPKIN_STEM
      - SWEET_BERRY_BUSH
      - TORCHFLOWER_CROP
      - PITCHER_CROP
      - SUGAR_CANE
      - CACTUS
    # Mondes où le module ne fait rien.
    excluded-worlds:
      - spawn
      - arene
      - Revent

  sculk:
    enabled: true
    # Délai, en secondes, pour recasser le même catalyseur et confirmer.
    confirmation-seconds: 10

  amethyst:
    enabled: true
    # Éclats lâchés par une grappe cassée sans Toucher de soie (tirés entre min et max).
    min-drops: 1
    max-drops: 1
    # Fortune ajoute son niveau à la quantité, sans dépasser max-drops.
    fortune-affects-amount: false
    # Envoyer le message amethyst.break à chaque grappe cassée.
    send-message: false

  signedit:
    enabled: true
    # Mondes où la règle s'applique ; ailleurs, seule la permission bypass permet d'éditer.
    worlds:
      - SuperiorWorld

  doors:
    enabled: true
    # Délai, en secondes, avant qu'une porte, une trappe ou un portillon reprenne son état.
    delay-seconds: 3
    worlds:
      - spawn
      - arene
    pairs:
      # Les deux battants d'une double porte s'ouvrent ensemble.
      doors: true
      # Deux trappes identiques côte à côte s'ouvrent ensemble.
      trapdoors: true
      # true : seulement dans les mondes ci-dessus ; false : partout.
      only-in-worlds: false

  islandbypass:
    enabled: true
