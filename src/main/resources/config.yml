# ============================================================================
#  SHTweaks : petits réglages de gameplay d'Opale
# ============================================================================
#
#  Chaque réglage est un module qui s'active ou se coupe avec « enabled ».
#  Le nom du module sert aussi dans messages.yml et dans ses permissions
#  (shtweaks.<module>.<permission>).
#
#  Modules :
#    items     Items au sol insensibles à la lave, au feu et aux explosions
#    anvils    Enclumes qui ne s'usent pas dans certains mondes
#    crops     S'accroupir fait pousser les cultures proches
#    sculk     Confirmation avant de casser un catalyseur de sculk
#    amethyst  Nombre d'éclats lâchés par une grappe d'améthyste, cassée par un
#              joueur, un piston ou un liquide
#    signedit  Modifier une pancarte déjà écrite : VIP, sur son île
#    doors     Portes, trappes et portillons qui reprennent leur état ; doubles portes
#    islandbypass  Mode bypass des îles (/is admin bypass) activé à la connexion
#                  pour ceux qui ont superior.admin.bypass ; le couper tient
#                  jusqu'au prochain redémarrage
#    redstone  Relance la redstone que SuperiorSkyblock2 a bloquée pendant que
#              l'île n'avait aucun membre connecté (disable-redstone-offline) :
#              répéteurs, comparateurs, observateurs, torches, poudre, lampes,
#              rails, ampoules, portes, trappes et portillons
#    recount   Recalcule une fois chaque île, quand un de ses membres s'y trouve,
#              pour remettre ses comptes de blocs (niveau d'île) d'accord avec
#              ce qui est posé ; les îles faites sont notées dans recount.yml
#    sellwandconfirm  Confirmation avant de vendre un coffre avec la sell wand
#                     de WildTools (premier clic : le prix, second clic : la vente)
#    lavawarn  Prévient les joueurs proches quand de la lave devient de l'obsidienne
#    ambientsounds  Sons d'ambiance joués à une position d'un monde
#    playerinteract  Shift + clic droit sur un joueur : lance les commandes réglées
#    kittycannon  /kittycannon : un chat qui explose
#
#  Les cinq derniers viennent d'anciens plugins : sans section dans ce fichier,
#  ils tournent avec les réglages de la fin de ce fichier.
#
#  Commandes :
#    /shtweaks reload   Recharge config.yml et messages.yml, relance les modules.
#                       Un fichier illisible ne change rien : aucun module n'est
#                       arrêté et l'ancienne configuration reste en place.
#    /shtweaks modules  Liste les modules et leur état.
#    /kittycannon       Module kittycannon : lance un chat qui explose.
#
#  Permissions :
#    shtweaks.admin            Toutes les sous-commandes de /shtweaks (op par défaut)
#    shtweaks.admin.reload     /shtweaks reload
#    shtweaks.admin.modules    /shtweaks modules
#    shtweaks.signedit.use     Modifier une pancarte déjà écrite sur son île
#    shtweaks.signedit.bypass  Modifier toutes les pancartes, partout
#    shtweaks.doors.bypass     Ce que le joueur ouvre ne reprend pas son état
#    shtweaks.playerinteract.use  Shift + clic droit sur un joueur
#    shtweaks.kittycannon.use     /kittycannon
# ============================================================================

modules:

  items:
    enabled: true
    # Items qui restent destructibles (un cactus récolté sur un cactus disparaît, comme en vanilla).
    excluded:
      - CACTUS

  anvils:
    enabled: true
    # Mondes où les enclumes ne s'usent jamais.
    worlds:
      - spawn

  crops:
    enabled: true
    # Rayon horizontal, en blocs, autour du joueur (une couche au-dessus et en dessous).
    radius: 2
    # Chance, sur 100, qu'une culture prenne un stade à chaque accroupissement.
    chance: 35
    # Délai minimal, en millisecondes, après un accroupissement qui a fait pousser quelque chose.
    cooldown-ms: 500
    # Blocs accélérés. Canne à sucre et cactus : l'âge monte, le bloc suivant pousse ensuite.
    crops:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
      - NETHER_WART
      - COCOA
      - MELON_STEM
      - PUMPKIN_STEM
      - SWEET_BERRY_BUSH
      - TORCHFLOWER_CROP
      - PITCHER_CROP
      - SUGAR_CANE
      - CACTUS
    # Mondes où le module ne fait rien.
    excluded-worlds:
      - spawn
      - arene
      - Revent

  sculk:
    enabled: true
    # Délai, en secondes, pour recasser le même catalyseur et confirmer.
    confirmation-seconds: 10

  amethyst:
    enabled: true
    # Éclats lâchés par une grappe cassée sans Toucher de soie (tirés entre min et max).
    min-drops: 1
    max-drops: 1
    # Fortune ajoute son niveau à la quantité, sans dépasser max-drops.
    fortune-affects-amount: false
    # Envoyer le message amethyst.break à chaque grappe cassée.
    send-message: false

  signedit:
    enabled: true
    # Mondes où la règle s'applique ; ailleurs, seule la permission bypass permet d'éditer.
    worlds:
      - SuperiorWorld

  doors:
    enabled: true
    # Délai, en secondes, avant qu'une porte, une trappe ou un portillon reprenne son état.
    delay-seconds: 3
    worlds:
      - spawn
      - arene
    pairs:
      # Les deux battants d'une double porte s'ouvrent ensemble.
      doors: true
      # Deux trappes identiques côte à côte s'ouvrent ensemble.
      trapdoors: true
      # true : seulement dans les mondes ci-dessus ; false : partout.
      only-in-worlds: false

  islandbypass:
    enabled: true

  redstone:
    enabled: true
    # Délai, en ticks, entre deux recherches de blocs à relancer sur les îles redevenues actives.
    interval-ticks: 20
    # Blocs retenus au maximum par chunk ; au-delà, les suivants ne sont pas relancés.
    max-per-chunk: 1024
    # Écrire dans la console le nombre de blocs relancés.
    log: true

  recount:
    enabled: false
    # Secondes entre deux recherches d'une île à recalculer (une seule île à la fois).
    interval-seconds: 10
    # Aucun recalcul quand le serveur tourne sous ce nombre de TPS (moyenne de la dernière minute).
    min-tps: 18
    # Écrire dans la console chaque île dont le niveau change, avec son niveau avant et après.
    log: true

  # ------------------------------------------------------------------------
  #  Modules repris d'anciens plugins : sans section ici, ils tournent avec
  #  les réglages ci-dessous (ceux du serveur au moment de la fusion).
  # ------------------------------------------------------------------------

  sellwandconfirm:
    enabled: true

  lavawarn:
    enabled: true
    sound:
      # Nom du son à jouer. Liste des sons disponibles ici: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
      # Exemple: ENTITY_EXPERIENCE_ORB_PICKUP, BLOCK_NOTE_BLOCK_PLING, ENTITY_PLAYER_LEVELUP
      name: "BLOCK_END_PORTAL_SPAWN"
      # Volume du son (0.0 à 2.0, 1.0 est normal)
      volume: 1.0
      # Hauteur (pitch) du son (0.5 à 2.0, 1.0 est normal)
      pitch: 2.0
    # Rayon en blocs autour de l'obsidienne pour notifier les joueurs.
    radius: 15.0

